name: wavedrom-gen

on:
  push:
    paths:
      - "wavedrom-gen/**"
      - ".mcp.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wavedrom-gen.yml"
  pull_request:
    paths:
      - "wavedrom-gen/**"
      - ".mcp.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wavedrom-gen.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
