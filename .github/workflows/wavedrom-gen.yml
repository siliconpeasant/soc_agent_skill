name: wavedrom-gen

on:
  push:
    paths:
      - "wavedrom-gen/**"
      - "README.md"
      - ".github/scripts/wavedrom-gen-self-test.mjs"
      - ".github/workflows/wavedrom-gen.yml"
  pull_request:
    paths:
      - "wavedrom-gen/**"
      - "README.md"
      - ".github/scripts/wavedrom-gen-self-test.mjs"
      - ".github/workflows/wavedrom-gen.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: wavedrom-gen/package-lock.json
      - run: npm ci
        working-directory: wavedrom-gen
      - run: node .github/scripts/wavedrom-gen-self-test.mjs
      - run: npm pack --dry-run
        working-directory: wavedrom-gen
      - run: node scripts/register-mcp.mjs --agent codex --dry-run
        working-directory: wavedrom-gen
      - run: node scripts/register-mcp.mjs --agent claude-code --scope user --dry-run
        working-directory: wavedrom-gen
